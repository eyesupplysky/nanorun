[package]
name = "nanorun"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
publish = false

[dependencies]

[dev-dependencies]

[features]
default = []
epoll = []
iocp = []
io_uring = []

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
